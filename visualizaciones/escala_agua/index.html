<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala Hídrica de la Palta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --agua-1: #0d3b4a;
    --agua-2: #1f7a8c;
    --agua-3: #4dc2d7;
    --agua-4: #a8e6ef;
    --palta-1: #4c6b2f;
    --palta-2: #8a9a3a;
    --palta-3: #c5d96a;
    --bg: #071512;
    --card: #0e2420;
    --card2: #091714;
    --ink: #eef3f1;
    --ink-dim: rgba(238,243,241,0.68);
    --sep: rgba(77,194,215,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: linear-gradient(145deg, #071512 0%, #0a1f1a 100%);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }

  /* ─── BURBUJAS ─── */
  .bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bubble {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(77,194,215,0.14), rgba(31,122,140,0.02));
    animation: float-up linear infinite;
  }
  @keyframes float-up {
    0%   { transform: translateY(100vh) scale(0.5); opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-20vh) scale(1.1); opacity: 0; }
  }

  /* ─── WRAP ─── */
  .wrap {
    position: relative; z-index: 1;
    max-width: 1300px; width: 100%; margin: 0 auto;
    padding: 0;
    box-sizing: border-box;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* ─── PANEL PRINCIPAL: panorámico, ancho y bajo ─── */
  .panel {
    background: rgba(14,36,32,0.82);
    border-radius: 20px;
    border: 1px solid var(--sep);
    overflow: hidden;
    box-shadow: 0 8px 48px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
    height: 100%;
  }

  /* ─── LAYOUT TV: paltas | centro vital (sin botones internos) ─── */
  .bipart {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(1rem, 2.2vw, 2rem);
    align-items: stretch;
    justify-content: center;
    width: 100%;
    max-width: 100%;
    min-height: 0;
  }
  .bipart .lado-paltas,
  .bipart .lado-equiv {
    width: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  /* TAGS DE COLUMNA */
  .lado-tag {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    font-size: .72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    padding: .2rem .7rem;
    border-radius: 999px;
    margin-bottom: .5rem;
  }
  .tag-palta {
    background: rgba(138,154,58,0.15);
    border: 1px solid rgba(197,217,106,0.3);
    color: var(--palta-3);
  }
  .tag-equiv {
    background: rgba(77,194,215,0.15);
    border: 1px solid rgba(77,194,215,0.35);
    color: var(--agua-3);
  }

  /* LADO IZQUIERDO — paltas (tags pegados arriba, resto agrandado) */
  .lado-paltas {
    background: linear-gradient(160deg, rgba(76,107,47,0.18) 0%, rgba(13,59,74,0.12) 100%);
    border-right: 1px solid var(--sep);
    padding: clamp(0.6rem, 1.5vh, 1rem) clamp(0.8rem, 2vw, 1.4rem);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    position: relative;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
  }
  .lado-paltas .lado-tag { align-self: flex-start; margin-bottom: 0.9rem; }
  .lado-equiv .lado-tag { align-self: flex-start; margin-bottom: 0.9rem; }
  .lado-paltas .sector-num {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(2.6rem, 5.5vw, 5rem);
    color: var(--palta-3);
    line-height: 1;
    margin-bottom: .2rem;
    transition: all .3s cubic-bezier(.34,1.56,.64,1);
  }
  .lado-paltas .sector-label {
    font-size: clamp(0.95rem, 1.6vw, 1.15rem);
    color: #8dae5a;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: .9rem;
    min-height: 1.2rem;
  }

  /* Grid de emojis (llena el ancho disponible) */
  .avo-field {
    width: 100%;
    max-width: 460px;
    min-height: 0;
    max-height: clamp(140px, 28vh, 250px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 5px;
    overflow: hidden;
    position: relative;
    margin: 0 auto;
  }
  .avo-field.dense { gap: 3px; }
  .avo-emoji {
    font-size: clamp(2.2rem, 5vh, 3.6rem);
    line-height: 1.15;
    animation: pop-in .25s ease backwards;
    display: inline-block;
  }
  .avo-field.dense .avo-emoji { font-size: clamp(1.7rem, 3.8vh, 2.7rem); }
  .avo-field.very-dense .avo-emoji { font-size: clamp(1.3rem, 2.8vh, 2rem); }
  @keyframes pop-in {
    from { transform: scale(0) rotate(-20deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  /* Fade bottom para muchas paltas */
  .avo-field.faded::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 80px;
    background: linear-gradient(transparent, var(--card2));
    pointer-events: none;
  }

  /* LADO DERECHO — equivalencia (centro vital, protagonista) */
  .lado-equiv {
    background: linear-gradient(160deg, rgba(13,59,74,0.28) 0%, rgba(31,122,140,0.16) 100%);
    padding: clamp(0.6rem, 1.5vh, 1rem) clamp(0.8rem, 2vw, 1.4rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    position: relative;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
  }

  /* Equivalencia visual: Número y textos arriba */
  .equiv-valor {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(2.8rem, 5.8vw, 5.2rem);
    font-weight: 700;
    color: var(--agua-3);
    line-height: 1.02;
    margin-bottom: .35rem;
    transition: all .25s ease;
  }
  .equiv-desc {
    font-size: clamp(1rem, 2vw, 1.35rem);
    color: var(--ink);
    font-weight: 600;
    line-height: 1.4;
    max-width: 32ch;
    margin: 0 auto;
  }

  /* Icono / Emoji en el centro */
  .equiv-visual {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: .7rem 0 0;
  }
  .equiv-icon {
    font-size: clamp(4.5rem, 9vw, 7.5rem);
    display: inline-block;
    line-height: 1.15;
    white-space: nowrap;
    filter: drop-shadow(0 6px 20px rgba(0,0,0,0.35));
    transition: transform .25s ease;
  }
  .equiv-icon:hover {
    transform: scale(1.1) rotate(4deg);
  }

  /* Mini fila de litros integrada bajo las paltas */
  .litros-mini {
    margin-top: .7rem;
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(1.1rem, 2.4vw, 1.8rem);
    font-weight: 700;
    color: var(--agua-3);
    background: rgba(13,59,74,0.4);
    border: 1px solid rgba(77,194,215,0.25);
    border-radius: 999px;
    padding: .4rem 1.1rem;
    white-space: nowrap;
    max-width: 100%;
  }

  /* ─── RESPONSIVE ─── */
  /* El iframe hereda el ancho del contenedor padre: usamos container queries
     implícitas vía aspect-ratio + clamp para no deformar en pantallas chicas */
  @media (max-width: 720px) {
    .bipart { grid-template-columns: 1fr; overflow-y: auto; }
    .lado-paltas { border-right: none; border-bottom: 1px solid var(--sep); }
    .lado-equiv { border-bottom: none; }
    .avo-emoji { font-size: clamp(0.9rem, 3vw, 1.2rem); }
    .equiv-valor { font-size: clamp(1.8rem, 8vw, 2.4rem); }
    .litros-mini { white-space: normal; text-align: center; }
  }
  /* Ventana del iframe angosta (el padre le da poco ancho): compactar */
  @media (max-width: 560px) {
    .lado-paltas .sector-num { font-size: clamp(1.4rem, 7vw, 2rem); }
    .equiv-valor { font-size: clamp(1.5rem, 7vw, 2rem); }
    .equiv-icon { font-size: clamp(2.2rem, 10vw, 3rem); }
  }
</style>
</head>
<body>

<div class="bg-particles" id="bg-particles"></div>

<div class="wrap">

  <!-- PANEL PRINCIPAL TRIPARTITO -->
  <div class="panel">

    <!-- TRIPARTITO: paltas | centro vital | botones -->
    <div class="bipart">

      <!-- IZQUIERDA: paltas en litros -->
      <div class="lado-paltas">
        <span class="lado-tag tag-palta">🥑 En paltas</span>
        <div class="sector-num" id="num-paltas">1</div>
        <div class="sector-label" id="label-paltas">palta</div>
        <div class="avo-field" id="avo-field"></div>
        <div class="litros-mini">💧 <span id="litros-val">100 litros</span> de agua</div>
      </div>

      <!-- CENTRO: información vital -->
      <div class="lado-equiv">
        <span class="lado-tag tag-equiv">💧 Equivale a...</span>
        <div class="equiv-valor" id="equiv-valor">1 día de agua</div>
        <div class="equiv-desc" id="equiv-desc">para 1 persona (ración diaria de 100 L)</div>
        <div class="equiv-visual">
          <span class="equiv-icon" id="equiv-icon">🧍</span>
        </div>
      </div>

    </div>

  </div><!-- /panel -->

</div><!-- /wrap -->

<script>
// ─── DATOS (fuente única de verdad) ─────────────────────────────────
// Base: ~1.100 L por kilo de palta (≈10 paltas de ~100 g) → 1 palta ≈ 110 L ≈ 1 ración diaria
// Estándar legal: 1 ración diaria = 100 L/día por persona (Corte Suprema y Contraloría)
// Requerimiento hídrico: ~1.100 m³ por tonelada de palta (coherente con mapa del proyecto)
// → 1 palta ≈ 110 L ≈ 1 día de agua para 1 persona
// → 1 ton = 1.100.000 L = 11.000 raciones = 11.000 días-persona ≈ 30 años para 1 persona
//    ≈ 1 día de agua para un pueblo de ~11.000 personas (ej. Petorca, región de Valparaíso)
// → Chile 2025-26: 265.000 ton (Diario Frutícola / Paltas de Chile)
//    = 291.500.000 m³ = 2.915 millones de raciones ≈ 364 días ≈ 12 meses para Santiago RM (~8 M personas)

const ESCALAS = [
  {
    key: "1palta",
    btnLabel: "🧍 1 palta",
    numPaltas: "1",
    labelPaltas: "palta (~100 g)",
    litros: 110,
    avos: 1,
    avoDense: false,
    icon: "🧍",
    valor: "1 día de agua",
    desc: "para 1 persona (ración diaria de 100 L)"
  },
  {
    key: "1ton",
    btnLabel: "🏘️ 1 tonelada",
    numPaltas: "≈10.000",
    labelPaltas: "paltas (1 tonelada)",
    litros: 1100000,
    avos: 220,
    avoDense: true,
    icon: "🏘️💧",
    valor: "30 años de agua",
    desc: "para 1 persona · o 1 día para Petorca entero"
  },
  {
    key: "265mil",
    btnLabel: "🏘️🏘️🏘️ Chile 25–26",
    numPaltas: "~2.650 millones",
    labelPaltas: "de paltas (cosecha 2025–26 · 265 mil ton)",
    litros: 291500000000,
    avos: 300,
    avoDense: true,
    icon: "🏘️🏘️🏘️",
    valor: "12 meses de agua",
    desc: "para todo Santiago"
  }
];

// ─── ESTADO ─────────────────────────────────────────────────────
let current = 0;

// ─── HELPERS ────────────────────────────────────────────────────
function formatLitros(l) {
  if (l >= 1e9)  return (l/1e9).toLocaleString('es-CL', {maximumFractionDigits:1}) + ' mil millones de litros';
  if (l >= 1e6)  return (l === 1e6 ? '1 millón de litros' : (l/1e6).toLocaleString('es-CL', {maximumFractionDigits:0}) + ' millones de litros');
  return l.toLocaleString('es-CL') + ' litros';
}

// ─── RENDER PALTAS ───────────────────────────────────────────────
function renderAvos(count, dense) {
  const field = document.getElementById('avo-field');
  field.innerHTML = '';

  // clases de densidad
  field.className = 'avo-field';
  if (count > 150) field.classList.add('very-dense');
  else if (count > 60) field.classList.add('dense');
  if (count > 100) field.classList.add('faded');

  const BATCH = 30; // animamos en lotes
  let rendered = 0;

  function addBatch() {
    const end = Math.min(rendered + BATCH, count);
    for (let i = rendered; i < end; i++) {
      const s = document.createElement('span');
      s.className = 'avo-emoji';
      s.textContent = '🥑';
      s.style.animationDelay = (i % BATCH) * 12 + 'ms';
      field.appendChild(s);
    }
    rendered = end;
    if (rendered < count) requestAnimationFrame(addBatch);
  }
  requestAnimationFrame(addBatch);
}

// ─── RENDER ESCALA (la TV solo muestra; el remoto vive en el index padre) ──
function setScale(idx) {
  current = idx;
  const d = ESCALAS[idx];

  // Animar — ocultar durante transición para evitar flash
  const animIds = ['num-paltas','label-paltas',
                   'equiv-valor','equiv-desc','equiv-icon'];
  animIds.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.transition = 'opacity .15s ease, transform .15s ease';
    el.style.transform = 'scale(0.85)';
    el.style.opacity = '0';
  });

  setTimeout(() => {
    document.getElementById('num-paltas').textContent = d.numPaltas;
    document.getElementById('label-paltas').textContent = d.labelPaltas;
    document.getElementById('equiv-valor').textContent = d.valor;
    document.getElementById('equiv-desc').textContent = d.desc;
    document.getElementById('equiv-icon').textContent = d.icon;
    document.getElementById('litros-val').textContent = formatLitros(d.litros);
    renderAvos(d.avos, d.avoDense);
    // Fade in
    animIds.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.style.transform = '';
      el.style.opacity = '';
    });
  }, 160);
}

// ─── CONTROL REMOTO EXTERNO (vive en index.html, fuera de la TV) ────
window.addEventListener('message', function(e) {
  const idx = e && e.data && e.data.escala;
  if (typeof idx === 'number' && ESCALAS[idx]) setScale(idx);
});

// ─── BURBUJAS ───────────────────────────────────────────────────
(function() {
  const c = document.getElementById('bg-particles');
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const s = Math.random() * 55 + 18;
    b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${Math.random()*22+14}s;animation-delay:${Math.random()*18}s;`;
    c.appendChild(b);
  }
})();

// ─── INIT ────────────────────────────────────────────────────────
setScale(0);

// Retransmitir wheel al parent para que el scroll del mouse funcione sobre este iframe
window.addEventListener('wheel', function(e) {
  if (window.parent !== window) {
    window.parent.postMessage({ tipo: 'wheel-scroll', deltaY: e.deltaY }, '*');
  }
}, { passive: true });
</script>
</body>
</html>
